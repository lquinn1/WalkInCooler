#Author: Luke Quinn
#Date: 1/21/2026
#Title: CoolBot Controller
#Function: Provides a controller to control a window airconditioner to acieve lower temperatures in a room than the ait conditioner was originally designed for.
#It does this by measuring temperatures or the room, the ac fins, and the outside air then through its logic applies current to a resistor to heat up the original controllers thermistor
#to trick the unit it to applying more air conditioning to the desired temperature of a walk in.
#Credit: Cold Snap Project, https://community.home-assistant.io/t/smart-cooler/819721
#Enhancement Ideas: Power monitoring, Door Sensor, Notifications outside of HA, Smoke Detector, Lighting, error handeling, encoder for input, door not latched buzzer.
#Components:
# 1) ESP32 DevkitC N16R8
# 2) Dallas DS18B20 Onewire Temperature Sensors
# 3) BME280 i2c Temperature, Humidity, and Pressure Sensor
# 4) 4-Channel 5v Relay Module with optocouplers
# 5) 4.7k Pull up resistors
# 6) 5W 100 Ohm 5% Axial Lead Wire White Wound Fixed Ceramic Power Resistors
# 7) Waveshare UPS Module 3s w/3 18650 Batteries and Charger (INA219 i2c power monitoring)
# 8) SD1306 128x64 oled i2c display
# Pins: 8-SDA,9-SCL, 16-OneWire, 48-LED, 4-AC Heater, 5-EXTFans, 6,7,10,11,12,13,14
#
# === Substitutions ===
# Define reusable variables for the project name and type to simplify configuration updates.
substitutions:
  name: "walkinchiller001"
  type: ESP

# === ESPHome Configuration ===
# Basic settings for the ESPHome integration, defining the device name and its user-friendly display name.
esphome:
  name: "${name}"
  friendly_name: "WalkIn-Chiller-001"
  comment: Deer-Chiller - Cold Room Control System

# === ESP32 Board and Framework ===
# Specify the board and framework type for the ESP32 device.
esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

# === Global Variables ===
# Define global variables to store and manage device states.
globals:
  - id: ac_state # Tracks whether the AC (or heater) is active.
    type: bool
    initial_value: 'false'
  - id: fan_state # Tracks whether the fan is active.
    type: bool
    initial_value: 'false'
  - id: deadband_state  # Manages the deadband logic to prevent rapid toggling.
    type: bool
    initial_value: 'false'
  - id: freeze_recovery # Indicates if freeze recovery mode is active.
    type: bool
    initial_value: 'false'
  - id: hysteresis # Temperature hysteresis range to avoid frequent toggling.
    type: float
    initial_value: '1.0'
  - id: margin # Safety margin to prevent fins from freezing.
    type: float
    initial_value: '4.0'
  - id: target # no idea what im doing
    type: float
    initial_value: '34.0'
    
# === Logging Configuration ===
# Enable logging to monitor the device's behavior.
logger:
  level: DEBUG

# === API Configuration ===
# Enable the API for integration with Home Assistant, including encryption for secure communication.
api:
  encryption:
    key: "p97Kk5PMQqd+PrebH7TEIzNhwPrxHVqRQnxLKiWZhq0="

# === OTA Updates ===
# Allow Over-The-Air updates with a secure password.
ota:
  - platform: esphome
    password: "994a754fd02223e9e8143b409cd1ec76"

# === Wi-Fi Configuration ===
# Configure Wi-Fi settings, including a fallback hotspot in case of connection failure.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  output_power: 8.5db
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "WalkIn-Chiller"
    password: "noconnection"

# === Text Sensors ===
# Provide network-related information (e.g., IP, SSID, MAC address) for diagnostics.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: "mdi:ip"
    ssid:
      name: "Connected SSID"
      icon: "mdi:wifi"
    bssid:
      name: "Connected BSSID"
      icon: "mdi:wifi"
    mac_address:
      name: "Mac Wifi Address"
      icon: "mdi:lan-connect"
    dns_address:
      name: "DNS Address"
      icon: "mdi:ip"
  - platform: template
    name: " Currently Running"
    id: currently_running
    icon: "mdi:earth"
    lambda: |-
      if (id(ac_state)) {
        return {"AC"};
      } else if (id(fan_state)) {
        return {"FANS"};
      } else if (id(deadband_state)) {
        return {"DEADBAND"};
      } else if (id(freeze_recovery)) {
        return {"FREEZE"};
      } else {
        return {"OFF"};
      }
    update_interval: 5s
    web_server:
      sorting_group_id: state_settings

# === Captive Portal ===
# Enable a fallback interface for device setup if Wi-Fi fails.
captive_portal:

# === Web Server ===
# Set up a web server for direct control and monitoring, with authentication.
web_server:
  version: 3
  auth:
    username: !secret app_user
    password: !secret app_password
  log: true
  local: true
  sorting_groups:
    - id: relay_settings
      name: "Relays"
      sorting_weight: -25
    - id: temperature_settings
      name: "Temperature"
      sorting_weight: -20
    - id: set_point_settings
      name: "Temperature SetPoints"
      sorting_weight: -15
    - id: state_settings
      name: "Status"
      sorting_weight: -10

# === HTTP Request ===
# Enable HTTP requests for external integrations.
http_request:
  useragent: esphome/device
  timeout: 10s
  verify_ssl: false

# === Time Synchronization ===
# Synchronize the device time with NTP servers.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org

# === Number Controls ===
# Define configurable settings for temperature setpoints and hysteresis.
number:
  - platform: template
    name: "Target Temp" # Target room temperature.
    id: target_temp
    unit_of_measurement: "°F"
    icon: "mdi:temperature-fahrenheit"
    optimistic: true
    min_value: 34
    max_value: 121
    step: 1
    initial_value: 34
    restore_value: true
    web_server:
      sorting_group_id: set_point_settings
  - platform: template
    name: "Hysteresis Range" # Range for temperature hysteresis.
    id: hysteresis_range
    unit_of_measurement: "°F"
    icon: "mdi:temperature-fahrenheit"
    optimistic: true
    min_value: 0.0
    max_value: 2.0
    step: 0.5
    initial_value: 0.5
    restore_value: true
    web_server:
      sorting_group_id: set_point_settings
  - platform: template
    name: "Freeze Recovery Margin" # Range for freezing temperature value addition.
    id: safety_margin
    unit_of_measurement: "°F"
    icon: "mdi:temperature-fahrenheit"
    optimistic: true
    min_value: 0
    max_value: 4
    step: 1
    initial_value: 4
    restore_value: true
    web_server:
      sorting_group_id: set_point_settings

# === 1-Wire Sensors ===
# Configure temperature sensors for monitoring room, fins, and outside temperatures.
one_wire:
  - platform: gpio
    pin: GPIO16
    id: dallas_1
    

# === i2c Sensors ===
# Configure temperature sensors for monitoring room, fins, and outside temperatures.  
i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a
  frequency: 400kHz

# === LED Control ===
# Configure an onboard LED with color effects for status indication.
light:
  - platform: neopixelbus
    type: GRB
    variant: ws2812
    pin: GPIO48
    name: "Onboard LED"
    id: onboard_led
    icon: "mdi:led-strip"
    num_leds: 1
    restore_mode: ALWAYS_ON
    on_turn_on:
      then:
        - light.control:
            brightness: 25%
            id: onboard_led
            effect: Green
    effects: # Predefined LED effects for visual feedback.
      - addressable_color_wipe: # Solid color effects.
          name: Red
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 1
          reverse: false
      - addressable_color_wipe:
          name: Green
          colors:
            - red: 0%
              green: 100%
              blue: 0%
              num_leds: 1
          reverse: false
      - addressable_color_wipe:
          name: Blue
          colors:
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 1
          reverse: false
      - addressable_color_wipe:
          name: White
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 1
          reverse: false
      - pulse: # Blinking effects.
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 1s      # defaults to 1s
          update_interval: 2s

# === Binary Sensors ===
# Monitor various states, such as AC, fan, and freeze recovery status.
binary_sensor:
  - platform: status
    name: "Status"
    icon: "mdi:state-machine"
  - platform: template
    name: "AC State"
    id: ac_state_value
    icon: "mdi:earth"
    lambda: |-
      if (id(ac_state)) {
        return true;      
      } else {
        return false;
      }
    web_server:
      sorting_group_id: state_settings
  - platform: template
    name: "FAN State"
    id: fan_state_value
    icon: "mdi:earth"
    lambda: |-
      if (id(fan_state)) {
        return true;      
      } else {
        return false;
      }
    web_server:
      sorting_group_id: state_settings
  - platform: template
    name: "DEADBAND State"
    id: deadband_state_value
    icon: "mdi:earth"
    lambda: |-
      if (id(deadband_state)) {
        return true;      
      } else {
        return false;
      }
    web_server:
      sorting_group_id: state_settings
  - platform: template
    name: "Freeze Recovery"
    id: freeze_recovery_value
    icon: "mdi:earth"
    lambda: |-
      if (id(freeze_recovery)) {
        return true;      
      } else {
        return false;
      }
    web_server:
      sorting_group_id: state_settings

